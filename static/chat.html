<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albatros AI V0.3</title><style>body{font-family:Arial;background:#f4f5f7;margin:0}.wrap{max-width:800px;margin:28px auto}.card{background:#fff;border:1px solid #ddd;border-radius:14px;overflow:hidden}.head{padding:18px}.m{padding:11px 13px;border-radius:12px;margin:8px;white-space:pre-wrap}.user{margin-left:20%;background:#e8edf5}.ai{margin-right:20%;background:#f1f1f1}#chat{height:520px;overflow:auto;padding:10px}.bar{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}#msg{flex:1;padding:12px}#file{display:none}.upload,button{padding:11px 14px}</style></head><body><div class="wrap"><div class="card"><div class="head"><b>Recepționer Albatros AI — V0.3</b><div>Talon + timpi manoperă</div></div><div id="chat"><div class="m ai">Bună ziua! Cu ce problemă vă pot ajuta la mașină?</div></div><div class="bar"><label class="upload" for="file">📎 Talon</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><input id="msg" placeholder="Scrie mesajul..."><button id="send">Trimite</button></div></div></div><script>let sid=localStorage.getItem('albatros_session_v03')||null;const chat=document.getElementById('chat'),msg=document.getElementById('msg'),send=document.getElementById('send'),file=document.getElementById('file');function add(t,c){let d=document.createElement('div');d.className='m '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function go(){let m=msg.value.trim();if(!m)return;add(m,'user');msg.value='';let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:m})});let d=await r.json();if(!r.ok){add('Eroare: '+(d.detail||'necunoscută'),'ai');return}sid=d.session_id;localStorage.setItem('albatros_session_v03',sid);add(d.answer,'ai')}send.onclick=go;msg.addEventListener('keydown',e=>{if(e.key==='Enter')go()});file.addEventListener('change',async()=>{if(!file.files.length)return;let f=file.files[0];add('Am încărcat talonul: '+f.name,'user');let fd=new FormData();fd.append('file',f);if(sid)fd.append('session_id',sid);let r=await fetch('/api/talon',{method:'POST',body:fd});let d=await r.json();if(!r.ok){add('Eroare: '+(d.detail||'necunoscută'),'ai');return}sid=d.session_id;localStorage.setItem('albatros_session_v03',sid);add(d.answer,'ai');file.value=''})</script></body></html>
