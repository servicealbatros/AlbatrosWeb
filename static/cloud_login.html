<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Autentificare • Albatros</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,sans-serif;background:#101f30;color:#172637;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#f8f7f2;border-radius:20px;padding:40px;box-shadow:0 24px 80px #0004}.brand{letter-spacing:.15em;font-weight:850;font-size:17px;color:#e75c33}h1{font-size:32px;line-height:1.2;margin:24px 0 10px}p{color:#66727c}label{display:block;font-size:14px;font-weight:650;margin-top:20px}input{display:block;width:100%;border:1px solid #c8cdd1;background:white;padding:13px;border-radius:8px;font:inherit;margin-top:6px}input:focus{outline:2px solid #e75c33;outline-offset:2px}button{font:inherit;font-weight:700;width:100%;padding:14px;border:0;border-radius:8px;background:#e75c33;color:white;margin-top:26px;cursor:pointer}a{color:#425362;font-size:14px;display:inline-block;margin-top:22px}</style></head>
<body><main class="card"><div class="brand">ALBATROS</div><h1>Autentificare</h1><p>Acces numai pentru utilizatori autorizați.</p><form method="post" action="/receptie/login"><label for="user">Utilizator</label><input id="user" name="username" autocomplete="username" required maxlength="120"><label for="pass">Parolă</label><input id="pass" name="password" type="password" autocomplete="current-password" required maxlength="256"><button type="submit">Autentificare</button></form><a href="https://servicealbatros.ro/">Înapoi la website</a></main></body></html>
