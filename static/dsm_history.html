<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baza locală DSM</title>
<style>body{font:16px system-ui;background:#f3f6fb;max-width:1100px;margin:30px auto;padding:15px}section,article{background:white;border-radius:12px;padding:20px;margin:15px 0}button,input{font:inherit;padding:10px;margin:5px}pre{white-space:pre-wrap}table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid #ddd}</style>
<a href="/cereri">Înapoi la dashboard</a><h1>Baza locală DSM</h1>
<section><p>Copie locală a devizelor și pieselor, identificată după VIN. Prețurile istorice nu sunt folosite ca prețuri curente.</p><button id="start" onclick="start()">Importă / reia din DSM</button><pre id="progress">Se încarcă…</pre></section>
<section><h2>Caută în baza locală</h2><input id="vin" placeholder="Seria de caroserie (VIN)"><input id="plate" placeholder="Număr înmatriculare"><button onclick="search()">Caută</button><div id="results"></div></section>
<script>
async function api(url,options={}){const r=await fetch(url,options);if(r.status===401||r.status===403){document.body.replaceChildren();location.replace('/receptie/login');throw Error('Acces revocat')}const d=await r.json();if(!r.ok)throw Error(d.detail||'Eroare');return d}
async function refresh(){try{const s=await api('/api/dashboard/dsm-history');document.getElementById('progress').textContent=`Stare: ${s.phase||'nepornit'}\nDevize inventariate: ${s.total}\nDevize citite: ${s.imported}\nMașini cu VIN: ${s.vehicles}\nRânduri de piese: ${s.parts}\nErori: ${s.errors}`+(s.last_error?'\n'+s.last_error:'');document.getElementById('start').disabled=['inventory','details'].includes(s.phase)}catch(e){document.getElementById('progress').textContent=e.message}}
async function start(){const b=document.getElementById('start');b.disabled=true;try{await api('/api/dashboard/dsm-history/start',{method:'POST',headers:{'X-Human-Action':'import-dsm-history'}});await refresh()}catch(e){alert(e.message);b.disabled=false}}
function cell(row,text){const td=document.createElement('td');td.textContent=text??'';row.append(td)}
async function search(){try{const v=document.getElementById('vin').value.trim(),p=document.getElementById('plate').value.trim();const d=await api('/api/dashboard/dsm-history/vehicle?vin='+encodeURIComponent(v)+'&registration='+encodeURIComponent(p));const root=document.getElementById('results');root.replaceChildren();const h=document.createElement('h3');h.textContent=d.found?`${d.vehicle} • ${d.vin}`:d.message;root.append(h);for(const t of d.transactions||[]){const a=document.createElement('article');const title=document.createElement('h3');title.textContent=`${t.document_code||t.transaction_id} • ${t.service_date||''} • ${t.status}`;a.append(title);const text=document.createElement('p');text.textContent=t.description;a.append(text);const table=document.createElement('table');const head=document.createElement('tr');for(const s of ['Tip','Cod','Marcă','Denumire','Cantitate'])cell(head,s);table.append(head);for(const r of [...t.parts||[],...t.labors||[]]){const row=document.createElement('tr');for(const x of [r.kind,r.code,r.manufacturer,r.name,r.quantity])cell(row,x);table.append(row)}a.append(table);root.append(a)}}catch(e){alert(e.message)}}refresh();setInterval(refresh,5000);
</script></html>
