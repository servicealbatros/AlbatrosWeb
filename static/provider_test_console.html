<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autentificare furnizori — test Render</title>
<style>body{font-family:system-ui;margin:24px;background:#f4f6fa;color:#172338}main{max-width:1000px;margin:auto}button,input{padding:12px;margin:6px;border:1px solid #abb9cd;border-radius:8px}button{cursor:pointer;background:#1768df;color:white}img{max-width:100%;border:1px solid #ccd4df;border-radius:8px}form{background:white;padding:14px;margin:12px 0;border-radius:10px}label{display:block}#status{white-space:pre-wrap}</style>
<main><h1>Autentificare furnizori în Render</h1><p>Test gratuit, fără trimitere de mesaje. Introdu datele numai pentru furnizorul indicat. Accesul expiră după 30 de minute.</p>
<div id="providers"></div><button id="refresh">Actualizează ecranul</button><button id="prepare">Pregătește filele pentru ofertare</button><p id="status">Se verifică accesul...</p><div id="forms"></div><img id="screen" alt="Ecranul furnizorului din browserul Render"></main>
<script>
const status=document.querySelector('#status');
async function api(path,body){const r=await fetch('/api/provider-auth/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}
function render(s){status.textContent=s.blocked_host?'Autentificarea a redirecționat către un domeniu care trebuie verificat: '+s.blocked_host:s.host?'Furnizor: '+s.host+(s.login_form_present?' — completează formularul.':' — nu apare formular de autentificare; urmează verificarea accesului în catalog.'):'Alege un furnizor.';
 document.querySelector('#screen').src=s.image||'';const container=document.querySelector('#forms');container.replaceChildren();
 for(const link of s.auth_navigation||[]){const b=document.createElement('button');b.textContent=link.text;b.onclick=()=>busy(async()=>render(await api('login-link',{index:link.index})));container.append(b)}
 for(const f of s.forms||[]){const form=document.createElement('form');const fields={};for(const x of f.fields){const label=document.createElement('label');label.textContent=x.label;const input=document.createElement('input');input.type=x.type==='password'?'password':'text';input.autocomplete='off';input.required=false;label.append(input);form.append(label);fields[x.index]=input;}
 for(const b of f.buttons){const button=document.createElement('button');button.type='button';button.textContent=b.text;button.onclick=()=>busy(async()=>{const values={};for(const [index,input]of Object.entries(fields))values[index]=input.value;const s=await api('submit',{form:f.index,button:b.index,fields:values});for(const input of Object.values(fields))input.value='';render(s)});form.append(button)}container.append(form);}}
async function busy(fn){status.textContent='Se încarcă...';try{await fn()}catch(e){status.textContent=e.message}}
document.querySelector('#refresh').onclick=()=>busy(async()=>render(await api('state')));
document.querySelector('#prepare').onclick=()=>busy(async()=>{const s=await api('prepare-offer',{});status.textContent=s.message});
(async()=>{try{const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);if(token)await api('session',{token});render(await api('state'));for(const provider of ['DSM','Inter Cars','AutoTotal','Haynes']){const button=document.createElement('button');button.textContent=provider;button.onclick=()=>busy(async()=>render(await api('open',{provider})));document.querySelector('#providers').append(button)}}catch(e){status.textContent='Acces protejat. Cere un link nou administratorului. '+e.message}})();
</script></html>
